<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>دنیای بازی</title>
  <style>
    body {
      margin: 0;
      font-family: Tahoma, sans-serif;
      background: #090b18;
      color: white;
      text-align: center;
      padding: 30px 15px;
    }
    .box {
      max-width: 500px;
      margin: 35px auto;
      padding: 25px;
      background: #171c36;
      border: 1px solid #a855f7;
      border-radius: 20px;
      box-shadow: 0 0 25px #7c3aed55;
    }
    h1 { color: #c084fc; }
    p { color: #cbd5e1; line-height: 2; }
    button {
      background: linear-gradient(90deg, #9333ea, #2563eb);
      color: white;
      border: 0;
      border-radius: 12px;
      padding: 13px 22px;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>🎮 دنیای بازی</h1>
    <p>به دنیای بازی خوش اومدی!</p>
    <p>برای شروع ماجراجویی آماده‌ای؟</p>
    <button onclick="startGame()">شروع بازی 🚀</button>
    <p id="message"></p>
  </div>

  <script>
    function startGame() {
      document.getElementById("message").textContent =
        "🎉 به‌زودی بازی‌های جذاب اضافه می‌شن!";
    }
  </script>
</body>
</html>
